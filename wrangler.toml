name = "tradebuddy"
main = "worker/index.js"
compatibility_date = "2025-04-01"
workers_dev = true

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
TRADIER_BASE_URL = "https://sandbox.tradier.com"

# Persistent production namespace. Do not replace on redeploy.
[[kv_namespaces]]
binding = "SETTINGS"
id = "c3b2c8a0e06b4414a0ad83e6af0cb9cb"

# Keep SETTINGS_SECRET as a Worker secret, never a plain-text vars entry.
# Preserve its existing value: changing it makes saved credentials unreadable.
# Other required secrets: TEAM_DOMAIN and POLICY_AUD.
# See docs/ACCOUNT_SETUP.md.
