name = "tradebuddy"
main = "worker/index.js"
compatibility_date = "2025-04-01"
workers_dev = true

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Not secret. Only used by the optional shared-token mode (ALLOW_SHARED_TOKEN=true).
[vars]
TRADIER_BASE_URL = "https://sandbox.tradier.com"

# Per-user encrypted settings. Wrangler creates this KV namespace on deploy if it does not exist.
[[kv_namespaces]]
binding = "SETTINGS"

# Secrets (set as type Secret in the dashboard, or with: npx wrangler secret put NAME):
#   SETTINGS_SECRET  a random string of 32+ characters that encrypts saved keys
#   TEAM_DOMAIN      https://<your-team>.cloudflareaccess.com
#   POLICY_AUD       the Application Audience (AUD) tag of the Access application
# See docs/ACCOUNT_SETUP.md.
